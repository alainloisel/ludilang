repos:
  # ==========================================================
  # Basic checks
  # ==========================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace

      - id: end-of-file-fixer

      - id: check-yaml

      - id: check-json

      - id: check-toml

      - id: check-merge-conflict

      - id: mixed-line-ending
        args: ["--fix=lf"]

      - id: check-added-large-files
        args: ["--maxkb=5000"]

  # ==========================================================
  # Prettier
  # ==========================================================

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - yaml
          - markdown

  # ==========================================================
  # ESLint
  # ==========================================================

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
        pass_filenames: true

  # ==========================================================
  # Secrets detection
  # ==========================================================

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
